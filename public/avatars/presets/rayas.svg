<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <clipPath id="circleClip">
      <circle cx="50" cy="50" r="48" />
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <!-- Red background -->
    <rect width="100" height="100" fill="#e2001a" />
    <!-- White vertical stripes -->
    <rect x="18" y="0" width="14" height="100" fill="#ffffff" />
    <rect x="44" y="0" width="12" height="100" fill="#ffffff" />
    <rect x="68" y="0" width="14" height="100" fill="#ffffff" />
  </g>
  <!-- Outer border ring -->
  <circle cx="50" cy="50" r="47" fill="none" stroke="#ffffff" stroke-width="3" />
  <circle cx="50" cy="50" r="48" fill="none" stroke="#b91c1c" stroke-width="1.5" />
</svg>
